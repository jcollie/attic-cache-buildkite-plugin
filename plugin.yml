name: Attic Cache
description: Enable caching of your Nix builds on your Buildkite agent using Attic
author: https://git.ocjtech.us/jeff/
requirements:
  - nix
configuration:
  properties:
    server:
      type: string
    endpoint:
      type: string
    token:
      type: string
    cache:
      type: string
  additionalProperties: false
